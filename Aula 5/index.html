<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="interative">
        <label>Nota 1: </label>
        <input type="number" id="n1" placeholder="0.0"><br>
        <label>Nota 2: </label>
        <input type="number" id="n2" placeholder="0.0"><br>
        <label>Nota 3: </label>
        <input type="number" id="n3" placeholder="0.0"><br>
        <button onclick="calcular()">Calcular media</button>
        <button onclick="limpar()">Limpar</button><br>
        <label>Media: </label> <label id="media"> </label><br>
        <label>Situação: </label> <label id="sit"> </label>
    </div>


    <script>
        function calcular() {
            let v1 = document.getElementById("n1").value;
            let v2 = document.getElementById("n2").value;
            let v3 = document.getElementById("n3").value;

            if (v1 === "" || v2 === "" || v3 === "") {
                alert("Preencha todas as notas.");
                return; // Para a execução aqui se estiver vazio
            }

           
            let n1 = parseFloat(v1);
            let n2 = parseFloat(v2);
            let n3 = parseFloat(v3);
            let r = 0;

            if (n1 < 0 || n2 < 0 || n3 < 0) {
                alert("Digite apenas números válidos.");
            }
            else if (n1 > 10 || n2 > 10 || n3 > 10) {
                alert("Digite números entre 0 e 10 apenas.");
            }
            else {
                r = (n1 + n2 + n3) / 3;
                document.getElementById("media").innerHTML = r.toFixed(2);

                if (r >= 7) {
                    document.getElementById("sit").innerHTML = "Aprovado.";
                    document.getElementById("sit").style.color = "#00ff00";
                } else if (r >= 5) {
                    document.getElementById("sit").innerHTML = "Recuperação.";
                    document.getElementById("sit").style.color = "#ff8000";
                } else {
                    document.getElementById("sit").innerHTML = "Reprovado.";
                    document.getElementById("sit").style.color = "#ff0000";
                }
            }
        }
        function limpar() {
            document.getElementById("n1").value = "";
            document.getElementById("n2").value = "";
            document.getElementById("n3").value = "";

            document.getElementById("media").innerHTML = "";
            document.getElementById("sit").innerHTML = "";

        }
    </script>
</body>

</html> <!-- "Alguma frase de Arte da Guerra" ~Sun Tzu -->
